<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D68A"/>
      <stop offset="100%" stop-color="#D4A843"/>
    </linearGradient>
    <radialGradient id="glow7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4A843" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#D4A843" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" rx="18" fill="#0C0C14"/>
  <ellipse cx="640" cy="160" rx="580" ry="150" fill="url(#glow7)"/>

  <text x="640" y="48" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff">From raw SMS to real insight</text>
  <text x="640" y="76" text-anchor="middle" font-size="15" fill="#9aa0b5">Every MoMo message becomes a categorized, budgeted, AI-understood transaction</text>

  <!-- connector -->
  <path d="M130 150 H 1150" stroke="#D4A843" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>

  <!-- 1: Capture (SMS bubble) -->
  <g>
    <circle cx="130" cy="150" r="42" fill="#14142A" stroke="#FFCC00" stroke-width="2.5"/>
    <rect x="112" y="132" width="36" height="26" rx="7" fill="none" stroke="#FFCC00" stroke-width="2.5"/>
    <path d="M120 158l-4 10 12-8" fill="none" stroke="#FFCC00" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M119 141h22M119 148h14" stroke="#FFCC00" stroke-width="2" stroke-linecap="round"/>
    <text x="130" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#e8eaf2">Capture</text>
    <text x="130" y="242" text-anchor="middle" font-size="12" fill="#9aa0b5">SMS &amp; CSV import, 11 providers</text>
  </g>

  <!-- 2: Parse (regex brackets) -->
  <g>
    <circle cx="385" cy="150" r="42" fill="#14142A" stroke="#D4A843" stroke-width="2.5"/>
    <text x="385" y="160" text-anchor="middle" font-family="Consolas, monospace" font-size="26" font-weight="700" fill="url(#gold2)">{.*}</text>
    <text x="385" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#e8eaf2">Parse</text>
    <text x="385" y="242" text-anchor="middle" font-size="12" fill="#9aa0b5">31 patterns, smart dedupe</text>
  </g>

  <!-- 3: Categorize (tag) -->
  <g>
    <circle cx="640" cy="150" r="42" fill="#14142A" stroke="#00B04F" stroke-width="2.5"/>
    <path d="M622 136h20l16 16-20 20h-20z" fill="none" stroke="#00B04F" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="630" cy="144" r="3" fill="#4fd68a"/>
    <text x="640" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#e8eaf2">Categorize</text>
    <text x="640" y="242" text-anchor="middle" font-size="12" fill="#9aa0b5">rules + AI, 18 Ghana categories</text>
  </g>

  <!-- 4: Understand (chart donut) -->
  <g>
    <circle cx="895" cy="150" r="42" fill="#14142A" stroke="#D4A843" stroke-width="2.5"/>
    <circle cx="895" cy="150" r="16" fill="none" stroke="#D4A843" stroke-opacity="0.35" stroke-width="7"/>
    <path d="M895 134a16 16 0 0 1 14 24" fill="none" stroke="#D4A843" stroke-width="7"/>
    <path d="M895 134a16 16 0 0 1 24 9" fill="none" stroke="#00B04F" stroke-width="7" stroke-opacity="0.8"/>
    <text x="895" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#e8eaf2">Understand</text>
    <text x="895" y="242" text-anchor="middle" font-size="12" fill="#9aa0b5">dashboards, budgets, goals</text>
  </g>

  <!-- 5: Advise (sparkle chat) -->
  <g>
    <circle cx="1150" cy="150" r="42" fill="#14142A" stroke="#E8C96B" stroke-width="2.5"/>
    <path d="M1150 128l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="url(#gold2)"/>
    <path d="M1164 148l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" fill="#E8C96B" opacity="0.75"/>
    <text x="1150" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#e8eaf2">Advise</text>
    <text x="1150" y="242" text-anchor="middle" font-size="12" fill="#9aa0b5">Qwen3-30B, Ghana-aware</text>
  </g>

  <!-- arrows -->
  <g fill="#D4A843" fill-opacity="0.75">
    <path d="M200 145l14 5-14 5z"/>
    <path d="M455 145l14 5-14 5z"/>
    <path d="M710 145l14 5-14 5z"/>
    <path d="M965 145l14 5-14 5z"/>
  </g>

  <!-- bottom stat bar -->
  <g>
    <rect x="380" y="272" width="520" height="34" rx="17" fill="#D4A843" fill-opacity="0.08" stroke="#D4A843" stroke-opacity="0.45"/>
    <text x="640" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#E8C96B">zero API costs &#8212; runs entirely on Cloudflare&#8217;s free tier</text>
  </g>
</svg>
