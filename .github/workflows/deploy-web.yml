name: Deploy Web (Cloudflare Pages)

# Auto-deploys the web app to Cloudflare Pages on every push to master that
# touches the web app or its workspace dependencies. Requires two repo secrets:
#   - CLOUDFLARE_API_TOKEN  (Pages:Edit permission)
#   - CLOUDFLARE_ACCOUNT_ID
# Without them the build still runs and the deploy step is skipped (no failure),
# so merging this workflow is safe before the secrets are configured.

on:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Surfaced at job level so the deploy step's `if` can test for its presence.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web (and workspace deps)
        run: pnpm exec turbo run build --filter=@cedisense/web

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy dist --project-name=cedisense --branch=master

      - name: Deploy skipped (no credentials)
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::warning::Build succeeded but deploy was skipped — add repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable auto-deploy to Cloudflare Pages."
